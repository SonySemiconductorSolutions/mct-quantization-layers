name: Run PyTorch Tests

on:
  workflow_call:
    inputs:
      torch-version:
        required: true
        type: string

jobs:
  run-pytorch-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python 3
        uses: actions/setup-python@v5
        with:
          python-version: 3.12.*
      - name: Install dependencies
        env:
          TORCH_VERSION: ${{ inputs.torch-version }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt          
          torch_major="${TORCH_VERSION%%.*}"
          torch_minor="${TORCH_VERSION#*.}"
          torch_minor="${torch_minor%%.*}"
          onnxscript_req=()
          if (( torch_major > 2 || (torch_major == 2 && torch_minor >= 9) )); then
            onnxscript_req+=("onnxscript==0.7.2")
          fi
          pip install "torch==$TORCH_VERSION" torchvision "onnx<1.18" "onnxruntime<1.22" "onnxruntime-extensions<0.14" "${onnxscript_req[@]}"
      - name: Record environment
        if: always()
        run: |
          echo "Source SHA: $GITHUB_SHA"
          python --version
          python -m pip list
      - name: Check dependencies
        run: python -m pip check
      - name: Run unittests
        run: python -m unittest discover tests/pytorch_tests -v
